<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrindo coisas</title>
</head>
<body>
    <h1>Descobrindo se Você é Brasileiro ou Não neguinn</h1>
    <form>
        <input type="text" name="seu-pais" id="pais" required>
        <input type="button" value="Enviar" onclick="descobrir()">
        <p id="res">Você é...</p>
    </form>
    <script>
        function descobrir(){
            var res = document.getElementById('res')
            var pais = document.getElementById('pais').value
            if (pais == "Brasil") {
                res.innerHTML = 'Você é <strong>Brasileiro</strong>'
            }
            else {
                res.innerHTML = `Você é de ${pais}, logo é estrangeiro!`
            }
        }
    </script>
</body>
</html>
