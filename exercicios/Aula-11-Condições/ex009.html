<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrindo coisas</title>
</head>
<body>
    <h1>Descobrindo se Você é Brasileiro ou Não neguinn</h1>
    <form>
        <input type="text" name="seu-pais" id="pais" required>
        <input type="button" value="Enviar" onclick="descobrir()">
        <p id="res">Você é...</p>
    </form>
    <script>
        function descobrir() {
            var pais = document.getElementById('pais')
            var pais = String(pais.value)
            var res = document.getElementById('res')
            if (pais === 'Brasil'){
                res.innerHTML = `Seu pais é o ${pais}. Você é Brasileiro`
            } 
            else {
            res.innerHTML = `Seu país é o... ${pais}. Você NÃO é Brasileiro`
            }
        }
    </script>
</body>
</html>
