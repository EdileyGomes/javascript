<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 20pt arial;

        }

        input {
            font: normal 20pt arial;
            width: 100px;
        }

    </style>
</head>
<body>
    <div class="form">
        <h1>Somando Valores</h1>
        <input class="form" type="number" name="txtn1" id="txtn1" min="0"> +
        <input class="form" type="number" name="txtn2" id="txtn2" min="0">
        <input class="form" type="button" value="somar" onclick="somar()">
        <p id="res">Resultado</p>
    </div>
    <script>
        var nome = window.prompt('Digite seu Nome')
        function somar(){
            var tn1 = document.getElementById('txtn1') 
            var tn2 = document.querySelector('input#txtn2')
            var res = document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            res.innerHTML = `A soma entre ${n1} + ${n2} = <strong>${s}</strong>`
        }
    </script>
</body>
</html>
