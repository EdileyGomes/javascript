<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loucuraaaaaa</title>
    <style>
        body {
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt("Qual é o Seu Nome: ")
        document.write(`Olá <strong>${nome}</strong>, seu nome tem ${nome.length} letras! <br />`)
        document.write(`Seu nome em Maiusculas é, <strong>${nome.toUpperCase()}</strong>! <br/>`)
        document.write(`E seu nome em minusculas é <small>${nome.toLowerCase()}</small>`)
    </script>
</body>
</html>
